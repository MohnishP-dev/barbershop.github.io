<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="Pankaj Barber Shop emblem">
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="82%">
      <stop offset="0" stop-color="#22222a"/>
      <stop offset=".55" stop-color="#131318"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </radialGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dca9"/>
      <stop offset=".5" stop-color="#c8a24a"/>
      <stop offset="1" stop-color="#8a6e2e"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#d9d2c4"/>
    </linearGradient>
    <clipPath id="ring"><circle cx="280" cy="280" r="262"/></clipPath>
  </defs>

  <!-- badge -->
  <circle cx="280" cy="280" r="268" fill="url(#bg)"/>
  <circle cx="280" cy="280" r="262" fill="none" stroke="url(#au)" stroke-width="3"/>
  <circle cx="280" cy="280" r="244" fill="none" stroke="#c8a24a" stroke-width="1" opacity=".45"/>

  <!-- barber-pole notch ring -->
  <g clip-path="url(#ring)" opacity=".22">
    <g stroke="#f4efe6" stroke-width="10">
      <path d="M-40 60 L120 -100M20 140 L180 -20M80 220 L240 60M140 300 L300 140M200 380 L360 220M260 460 L420 300M320 540 L480 380M380 620 L540 460M440 700 L600 540M500 780 L660 620"/>
      <path d="M-40 460 L120 300M20 540 L180 380M80 620 L240 460M140 700 L300 540M200 780 L360 620M-40 -200 L120 -340M20 -120 L180 -260"/>
    </g>
  </g>
  <circle cx="280" cy="280" r="262" fill="none" stroke="#0a0a0c" stroke-width="26" opacity=".0"/>

  <!-- soft inner panel -->
  <circle cx="280" cy="280" r="206" fill="#0d0d10" opacity=".72"/>
  <circle cx="280" cy="280" r="206" fill="none" stroke="#c8a24a" stroke-width="1.2" opacity=".7"/>

  <!-- crossed scissors + razor -->
  <g fill="none" stroke="url(#au)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="203" cy="245" r="17"/>
    <circle cx="267" cy="245" r="17"/>
    <path d="M215.5 233 318 118M254.5 233 152 118"/>
  </g>
  <g fill="none" stroke="url(#au)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M330 176 404 102"/>
    <path d="M324 190 340 206 316 214 302 200z"/>
    <path d="M396 94 414 112 404 122 388 104z"/>
  </g>
  <circle cx="235" cy="205" r="5" fill="#ecd69a"/>

  <!-- wordmark -->
  <text x="280" y="330" text-anchor="middle"
        font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif"
        font-size="76" font-weight="700" letter-spacing="10"
        fill="url(#cream)">PANKAJ</text>

  <!-- rule with diamond -->
  <g stroke="#c8a24a" stroke-width="1.6" opacity=".85">
    <path d="M118 360 H256"/><path d="M304 360 H442"/>
  </g>
  <path d="M280 350 290 360 280 370 270 360z" fill="#c8a24a"/>

  <text x="280" y="404" text-anchor="middle"
        font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif"
        font-size="27" font-weight="400" letter-spacing="13"
        fill="#ecd69a">BARBER SHOP</text>

  <!-- bottom mark -->
  <g stroke="#c8a24a" stroke-width="1.4" opacity=".7">
    <path d="M150 440 H232"/><path d="M328 440 H410"/>
  </g>
  <text x="280" y="447" text-anchor="middle"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="600" letter-spacing="6"
        fill="#9c968b">MUSCAT · OMAN</text>
</svg>
