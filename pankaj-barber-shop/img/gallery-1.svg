<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Barber scissors">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e25"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="62%">
      <stop offset="0" stop-color="#c8a24a" stop-opacity=".34"/>
      <stop offset="1" stop-color="#c8a24a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="30" height="30" fill="none"/>
      <rect width="15" height="30" fill="#f4efe6" fill-opacity=".035"/>
    </pattern>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dca9"/><stop offset=".5" stop-color="#c8a24a"/><stop offset="1" stop-color="#8a6e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#g)"/>
  <rect width="800" height="1000" fill="url(#stripes)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#c8a24a" stroke-opacity=".35" stroke-width="2"/>

  <g transform="translate(400 470) rotate(-32)">
    <g fill="none" stroke="url(#au)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" transform="scale(3.1)">
      <circle cx="-16" cy="70" r="15"/>
      <circle cx="16" cy="70" r="15"/>
      <path d="M-6 57 40 -66"/>
      <path d="M6 57 -40 -66"/>
      <path d="M-2 44 22 2" stroke-opacity=".55"/>
      <circle cx="0" cy="14" r="3.6" fill="#ecd69a" stroke="none"/>
    </g>
  </g>

  <g fill="none" stroke="#c8a24a" stroke-opacity=".55" stroke-width="2">
    <path d="M120 830 H330"/><path d="M470 830 H680"/>
  </g>
  <path d="M400 818 414 830 400 842 386 830z" fill="#c8a24a" fill-opacity=".8"/>
  <text x="400" y="898" text-anchor="middle" font-family="'Arial Narrow',Arial,sans-serif" font-size="30" letter-spacing="14" fill="#9c968b">SCISSORS</text>
</svg>
